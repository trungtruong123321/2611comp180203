<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách sản phẩm - CSS Box Model</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 30px 15px;
            font-family: Arial, sans-serif;
            color: #333;
            background-color: white;
        }
        h1 {
            text-align: center;
            font-size: 26px;
        }
        .danh-sach {
            width: 880px;
            max-width: 100%;
            margin: 30px auto;
            padding: 10px;
            border: 1px solid #ccc;
            text-align: center;
        }
        .hh-box {
            position: relative;
            display: inline-block;
            vertical-align: top;
            width: 200px;
            height: 180px;
            margin: 25px 5px 10px;
            padding: 15px 0;
            border-radius: 5px;
            box-shadow: 0 0 5px silver;
            text-align: center;
        }

        .hh-box:hover {
            box-shadow: 0 0 5px red;
        }
        .hh-box-name {
            position: absolute;
            top: -22px;
            left: 0;
            width: 100%;
            margin: 0;
            font-size: 15px;
            font-weight: normal;
            text-align: center;
        }
        .hh-box-image {
            width: 130px;
            height: 130px;
            object-fit: contain;
        }
        .hh-box-icon {
            position: absolute;
            top: 4px;
            right: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #e53935;
            color: white;
            font-size: 10px;
            font-weight: bold;
        }
        .hh-box-price {
            position: absolute;
            left: 8px;
            bottom: 8px;
            color: #666;
            font-size: 14px;
            font-weight: bold;
        }
        .hh-box-actions {
            position: absolute;
            right: 8px;
            bottom: 5px;
            width: 25px;
        }
        .hh-box-actions a {
            display: block;
            width: 25px;
            height: 28px;
            line-height: 28px;
            text-align: center;
            text-decoration: none;
            color: #777;
            font-size: 22px;
            cursor: pointer;
        }
        .hh-box-actions a:hover,
        .hh-box-actions a:focus-visible {
            color: #e53935;
            background-color: #eee;
            border-radius: 4px;
        }
        .phan-trang {
            margin: 10px 0 5px;
        }
        .phan-trang a {
            display: inline-block;
            margin: 3px;
            padding: 8px 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            color: #333;
            background-color: #f5f5f5;
            text-decoration: none;
            font-size: 14px;
        }

        .phan-trang a:hover,
        .phan-trang a:focus-visible {
            background-color: #ddd;
        }
    </style>
</head>
